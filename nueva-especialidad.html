<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agregar Especialidad — APTIM Pisco</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app-header"></div>

  <main class="form-container">

    <!-- Formulario nueva especialidad -->
    <div class="card">
      <div class="datos-generales">
        <div class="field field-full">
          <label for="esp-nombre">Nombre de la Especialidad</label>
          <input type="text" id="esp-nombre" placeholder="Ej: Soldadura, Electricidad...">
        </div>
        <div class="field">
          <label for="esp-icono">Ícono (emoji)</label>
          <input type="text" id="esp-icono" placeholder="Ej: ⚡ 🔩 🪚" maxlength="4">
        </div>
        <div class="field">
          <label for="esp-num-items">Número de Ítems</label>
          <input type="number" id="esp-num-items" min="1" max="30" placeholder="Ej: 12">
        </div>
      </div>
    </div>

    <!-- Ítems dinámicos -->
    <div id="items-dinamicos-section" style="display:none">
      <div class="section-title" id="items-titulo">Definir Ítems de Evaluación</div>
      <div class="card" style="border-radius:0 0 10px 10px; margin-top:0;">
        <div class="items-dinamicos" id="items-dinamicos-container"></div>
      </div>
    </div>

    <!-- Botones -->
    <div class="botones-accion">
      <button class="btn-primary" id="btn-guardar-esp">💾 Guardar Especialidad</button>
      <a href="index.html" class="btn-secondary">← Volver</a>
    </div>

    <!-- Lista de especialidades guardadas -->
    <div class="card" style="margin-top:2rem;">
      <div style="font-size:0.75rem;font-weight:700;color:var(--acero-hielo);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:1rem;">
        Especialidades Creadas
      </div>
      <div class="esp-lista" id="esp-lista">
        <div style="color:var(--texto-apagado);font-size:0.85rem;">No hay especialidades creadas aún.</div>
      </div>
    </div>

  </main>

  <script src="js/app.js"></script>
  <script src="js/especialidades.js"></script>
</body>
</html>
